<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Treino — limpando cache</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f5fb;
      color: #3b3550;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #6f6887; font-size: 0.95rem; }
    a { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Limpando cache do app…</h1>
    <p id="status">Removendo service workers e caches antigos.</p>
    <p><a href="./">Voltar ao app</a></p>
  </div>
  <script>
    (async function () {
      var status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        status.textContent = 'Pronto! Abrindo o app atualizado…';
      } catch (e) {
        status.textContent = 'Não deu para limpar tudo, mas vou abrir o app.';
      }
      setTimeout(function () { location.replace('./'); }, 800);
    })();
  </script>
</body>
</html>
