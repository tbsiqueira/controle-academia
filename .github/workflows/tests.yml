name: Testes

# Roda os testes de unidade e as verificações estáticas a cada push na main e em pull requests.
# Os jobs abaixo são checks obrigatórios do PR na main (ruleset "main"): mudou o nome de um job,
# atualize o ruleset. O deploy fica em deploy.yml (publica ao entrar versão nova na main).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # deploy.yml calls this whole workflow as the publish gate, so the checks a PR must pass and the checks a
  # publish must pass are the same jobs: anything added here also gates publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verificar sintaxe dos scripts de navegador
        run: |
          for f in js/core.js js/app.js js/db.js sw.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Rodar testes e medir cobertura de js/core.js
        env:
          COVERAGE_ENFORCE: '1'
        run: node tools/coverage-gate.js

  estatico:
    name: Verificações estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rodar check.ps1
        shell: pwsh
        run: ./check.ps1

  # Testes de navegador (Playwright): o app de verdade num Chromium de celular. Veja documentation/REFACTOR.md.
  navegador:
    name: Testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Instalar ferramentas (package-lock.json)
        run: npm ci

      # No --with-deps: it runs apt-get for Chromium's Linux libraries, and slow Ubuntu mirrors made that take
      # 4-6 minutes. The ubuntu-latest image already ships those libraries (it has Google Chrome preinstalled).
      # If Playwright reports "Host system is missing dependencies", add only the packages it names
      # (sudo apt-get install -y <pkg>), or move this job to the Playwright container image.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install chromium

      - name: Rodar os testes de navegador
        run: npx playwright test

      # Catraca (documentation/REFACTOR.md, seção 4): a cobertura do js/app.js pelos testes de navegador vai para o
      # resumo do job e não pode cair em relação à main. Subiu? O PR atualiza tests/e2e/coverage-baseline.json.
      - name: Cobertura do js/app.js (catraca)
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git show origin/main:tests/e2e/coverage-baseline.json > "$RUNNER_TEMP/baseline-main.json" 2>/dev/null; then
            cp tests/e2e/coverage-baseline.json "$RUNNER_TEMP/baseline-main.json"
          fi
          node tools/e2e-coverage.js --baseline "$RUNNER_TEMP/baseline-main.json"

      - name: Guardar relatório e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes-navegador
          path: |
            tests/e2e/report/
            tests/e2e/results/
          retention-days: 14

  # Só em PR: mexeu no app (index.html, css/, js/) → a versão precisa subir e ser nova,
  # senão o merge não publica nada (deploy.yml só publica versão sem tag).
  versao:
    name: Versão
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conferir o bump de versão
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          base=$(git show "origin/$BASE_REF:index.html" | grep -oP 'id="appVersion">v\K\d+')
          head=$(grep -oP 'id="appVersion">v\K\d+' index.html)
          echo "main: v$base | PR: v$head"
          if [ "$head" -lt "$base" ]; then
            echo "::error::a versao do PR (v$head) e menor que a da main (v$base). Faca rebase na main."
            exit 1
          fi
          if git diff --quiet "origin/$BASE_REF...HEAD" -- index.html css js; then
            echo "Sem mudanca em index.html, css/ ou js/: bump nao exigido."
            exit 0
          fi
          if [ "$head" -le "$base" ]; then
            echo "::error::index.html, css/ ou js/ mudou mas a versao continua v$head. Suba para v$((base + 1)) (veja documentation/agents/workflow.md)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$head" >/dev/null; then
            echo "::error::a tag v$head ja existe. Faca rebase na main e suba a versao."
            exit 1
          fi
          echo "OK: v$base -> v$head"
