name: Tests

# Runs the unit tests and the static checks on every push to main and in pull requests.
# The jobs below are the required checks of the `main` ruleset ("main"): if a job name changes,
# update the ruleset. The deploy lives in deploy.yml (publishes when a new version lands on main).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # deploy.yml calls this whole workflow as the publish gate, so the checks a PR must pass and the checks a
  # publish must pass are the same jobs: anything added here also gates publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check the syntax of the browser scripts
        run: |
          for f in js/core.js js/app.js js/db.js sw.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run the tests and measure js/core.js coverage
        env:
          COVERAGE_ENFORCE: '1'
        run: node tools/coverage-gate.js

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run check.ps1
        shell: pwsh
        run: ./check.ps1

  # Browser tests (Playwright): the real app in a mobile Chromium. See documentation/REFACTOR.md.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install tools (package-lock.json)
        run: npm ci

      # No --with-deps: it runs apt-get for Chromium's Linux libraries, and slow Ubuntu mirrors made that take
      # 4-6 minutes. The ubuntu-latest image already ships those libraries (it has Google Chrome preinstalled).
      # If Playwright reports "Host system is missing dependencies", add only the packages it names
      # (sudo apt-get install -y <pkg>), or move this job to the Playwright container image.
      - name: Install Playwright's Chromium
        run: npx playwright install chromium

      - name: Run the browser tests
        run: npx playwright test

      # Ratchet (documentation/REFACTOR.md, section 4): the js/app.js coverage from the browser tests goes into the
      # job summary and cannot drop below main. Rose? The PR updates tests/e2e/coverage-baseline.json.
      - name: js/app.js coverage (ratchet)
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git show origin/main:tests/e2e/coverage-baseline.json > "$RUNNER_TEMP/baseline-main.json" 2>/dev/null; then
            cp tests/e2e/coverage-baseline.json "$RUNNER_TEMP/baseline-main.json"
          fi
          node tools/e2e-coverage.js --baseline "$RUNNER_TEMP/baseline-main.json"

      - name: Save the report and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            tests/e2e/report/
            tests/e2e/results/
          retention-days: 14

  # PR-only: touched the app (index.html, css/, js/) -> the version must go up and be new,
  # otherwise the merge publishes nothing (deploy.yml only publishes a version without a tag).
  version:
    name: Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # app.json is the source of the version. A base that predates app.json still has it only in index.html
          # (that fallback becomes dead code once app.json is on main: remove it then).
          base=$(git show "origin/$BASE_REF:app.json" 2>/dev/null | node tools/set-version.js --print - 2>/dev/null \
            || git show "origin/$BASE_REF:index.html" | grep -oP 'id="appVersion">v\K\d+' || true)
          head=$(node tools/set-version.js --print app.json || true)
          if [ -z "$head" ] || [ -z "$base" ]; then
            echo "::error::could not read the version (PR: '$head', $BASE_REF: '$base'); app.json must hold {\"version\": N}."
            exit 1
          fi
          echo "main: v$base | PR: v$head"
          if [ "$head" -lt "$base" ]; then
            echo "::error::the PR version (v$head) is lower than main's (v$base). Rebase onto main."
            exit 1
          fi
          if git diff --quiet "origin/$BASE_REF...HEAD" -- index.html css js; then
            echo "No change in index.html, css/ or js/: bump not required."
            exit 0
          fi
          if [ "$head" -le "$base" ]; then
            echo "::error::index.html, css/ or js/ changed but the version is still v$head. Set app.json to {\"version\": $((base + 1))}, run 'node tools/set-version.js' and commit app.json, index.html and sw.js (see documentation/agents/workflow.md)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$head" >/dev/null; then
            echo "::error::tag v$head already exists. Rebase onto main and bump the version."
            exit 1
          fi
          echo "OK: v$base -> v$head"
