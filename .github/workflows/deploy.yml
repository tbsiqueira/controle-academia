name: Publicar no GitHub Pages

# Publica APENAS quando uma tag de versão é enviada (v1, v2, ...).
# Push na branch main não publica nada.
on:
  push:
    tags:
      - 'v*'
  # Permite publicar manualmente pela aba Actions (escape hatch).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Testes e verificações
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes unitários
        run: node --test tests/

      - name: Verificações estáticas
        shell: pwsh
        run: ./check.ps1

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
