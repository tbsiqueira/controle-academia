name: Publish to GitHub Pages

# Publishes on its own when a PR with a new version lands on main.
# The version comes from <span id="appVersion">vN</span> in index.html:
#   - if tag vN does not exist yet -> tests, publishes and creates tag vN;
#   - if tag vN already exists (docs/CI-only PR, no bump) -> publishes nothing.
# Nobody creates a tag by hand: this workflow creates it, after publishing.
on:
  push:
    branches:
      - main
  # Escape hatch: publishes the current state of main from the Actions tab (creates the tag if missing).
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; does not cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    name: Version to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version and check whether the tag exists
        id: v
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(grep -oP 'id="appVersion">v\K\d+' index.html)
          if [ -z "$version" ]; then echo "::error::version not found in index.html"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$MANUAL" = "true" ]; then
              echo "Tag v$version already exists; manual publish continues anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$version already exists: nothing new to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New version: v$version will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Publish gate: runs the entire Tests workflow (tests.yml) instead of copying its steps here, so a publish only
  # happens for a commit that passed unit, static and browser tests. check.ps1 fails if this call disappears.
  verify:
    name: Tests and checks
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  tag:
    name: Create the version tag
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create and push vN
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject=$(git log -1 --format=%s)
          git tag -a "v$VERSION" -m "v$VERSION: $subject"
          git push origin "v$VERSION"
