
name: Publish to GitHub Pages and Cloudflare UAT

# Publishes when a new version lands on main.
# The version comes from app.json (the single source; tools/set-version.js stamps it into index.html and sw.js):
#   - if tag vN does not exist yet -> tests, deploys to both platforms and creates tag vN;
#   - if tag vN already exists -> does nothing on push;
#   - manual dispatch always deploys the current version, even if its tag exists.
# The version tag is created only after both deployments succeed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; does not cancel one already in progress.
concurrency:
  group: deployments
  cancel-in-progress: false

jobs:
  version:
    name: Version to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version and check whether the tag exists
        id: v
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(grep -oP '"version"\s*:\s*\K\d+' app.json)
          if [ -z "$version" ]; then
            echo "::error::version not found in app.json"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$MANUAL" = "true" ]; then
              echo "Tag v$version already exists; manual publish continues anyway."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$version already exists: nothing new to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New version: v$version will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Run the complete test workflow before either deployment.
  verify:
    name: Tests and checks
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml

  # Existing GitHub Pages deployment.
  publish:
    name: Publish to GitHub Pages
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # New Cloudflare Workers UAT deployment.
  deploy-uat:
    name: Deploy to Cloudflare UAT
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages-uat
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Cloudflare deployment
        shell: pwsh
        run: ./tools/package-cloudflare.ps1

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # Create the version tag only after both deployments succeed.
  tag:
    name: Create the version tag
    needs: [version, publish, deploy-uat]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create and push vN
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          subject=$(git log -1 --format=%s)
          git tag -a "v$VERSION" -m "v$VERSION: $subject"
          git push origin "v$VERSION"
